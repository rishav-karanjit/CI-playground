name: Generate Dashboard

on:
  workflow_call:
    inputs:
      repository:
        description: "Target repository name"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Check out GitHub Pages branch
        uses: actions/checkout@v3
        with:
          ref: 'gh-pages'

      - name: 'Generate Dashboard'
        uses: ethomson/issue-dashboard@v1
        with:
          config: |
            title: ${{ inputs.repository }} Issue/PR Dashboard
            description: |
              Issues and PRs for ${{ inputs.repository }}
            output:
              format: html
              filename: dashboard/index.html
            sections:
            - title: 'Issues'
              description: 'Issues with no comments'
              widgets:
              - type: 'number'
                title: 'Issues with updates in the last 14 days'
                issue_query: 'repo:${{ inputs.repository }} is:issue is:open
                color: 'yellow'
          token: ${{ github.token }}
      - name: Publish Documentation
        run: |
          git add dashboard/index.html
          git config user.name 'Github Actions'
          git config user.email 'githubactions@users.noreply.github.com'
          git commit -m 'Documentation update' --allow-empty
          git push origin gh-pages
